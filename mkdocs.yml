site_name: AI/ML Resource Hub
site_description: A community-maintained knowledge base for learning Artificial Intelligence and Machine Learning, from foundations to research.
site_author: University AI/ML Department
site_url: https://your-org.github.io/AI-ML-Resource-Hub/

repo_name: AI-ML-Resource-Hub
repo_url: https://github.com/Anasarfeen123/AI-ML-Resource-Hub
edit_uri: edit/main/docs/

copyright: Copyright &copy; MIC VITC

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: en
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.critic
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/AI-ML-Resource-Hub
  generator: false

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Foundations:
      - foundations/index.md
      - Python for AI: foundations/python.md
      - Mathematics: foundations/mathematics.md
      - Statistics: foundations/statistics.md
      - Optimization: foundations/optimization.md
  - Machine Learning:
      - machine-learning/index.md
      - Introduction: machine-learning/introduction.md
      - Algorithms: machine-learning/algorithms.md
      - Model Evaluation: machine-learning/evaluation.md
      - Projects: machine-learning/projects.md
  - Deep Learning:
      - deep-learning/index.md
      - Fundamentals: deep-learning/fundamentals.md
      - CNNs: deep-learning/cnn.md
      - Transformers: deep-learning/transformers.md
      - Frameworks: deep-learning/frameworks.md
  - Computer Vision:
      - computer-vision/index.md
  - NLP:
      - natural-language-processing/index.md
  - Generative AI:
      - generative-ai/index.md
  - Reinforcement Learning:
      - reinforcement-learning/index.md
  - Research:
      - research/index.md
  - Resource Library:
      - resources/index.md
  - Project Ideas:
      - projects/index.md
  - Contributing: contribution.md
