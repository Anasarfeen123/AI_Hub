# Weekly jobs for the live hub: reminder emails to quiet members, and a check
# of every external link. Render's free tier sleeps, so the app can't keep its
# own timer; this wakes it and asks it to run them.
#
# Enable by adding two repository secrets (Settings → Secrets → Actions):
#   SITE_URL     the hub's address, e.g. https://mic-aiml-resource-hub.onrender.com
#   CRON_SECRET  the same long random value as CRON_SECRET in Render's environment
name: Weekly jobs

on:
  schedule:
    - cron: "30 3 * * 1" # Mondays 09:00 India time
  workflow_dispatch: {}

permissions: {}

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the site and run the weekly jobs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Forgive the usual paste slips: surrounding spaces/newlines, a trailing slash.
          SITE_URL="$(printf '%s' "$SITE_URL" | tr -d '[:space:]')"
          SITE_URL="${SITE_URL%/}"
          CRON_SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')"

          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL / CRON_SECRET secrets aren't set — skipping."
            exit 0
          fi
          if [ "${#CRON_SECRET}" -lt 16 ]; then
            echo "::error::CRON_SECRET is shorter than 16 characters; the site ignores short secrets. Use a longer one in both GitHub and Render."
            exit 1
          fi

          # A sleeping free instance takes up to a minute to start.
          for i in $(seq 1 8); do
            if curl -sf --max-time 30 "$SITE_URL/api/health" > /dev/null; then break; fi
            echo "Waiting for the site to wake up…"
            sleep 15
          done

          code=$(curl -s -o response.txt -w '%{http_code}' --max-time 120 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/weekly")
          echo "HTTP $code"
          cat response.txt; echo

          if [ "$code" = "200" ]; then
            echo "✅ Weekly jobs started."
          elif [ "$code" = "404" ]; then
            echo "::error::The site refused the secret. Check that CRON_SECRET is set in Render (Environment tab, then wait for the redeploy) and is exactly the same value as the GitHub secret."
            exit 1
          else
            echo "::error::Unexpected response from $SITE_URL — check the site is up and SITE_URL is its address."
            exit 1
          fi
